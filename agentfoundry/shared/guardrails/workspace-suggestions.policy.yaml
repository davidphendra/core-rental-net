# The content-safety policy the deployed agent carries, written down here so it is reviewable and so a
# change to it is a diff. The policy itself is a Foundry resource attached to the agent - one
# attachment covers all four nodes, because the four run inside one agent.
#
# It is NOT the whole guardrail. A content policy judges language, which is what it is for; it cannot
# judge a SKU that does not exist, a quantity beyond the canvas's capacity, or whether catalogue text
# was treated as data. Those are the code's, and they are asserted in tests rather than configured here.
name: workspace-suggestions
description: What the workspace suggestion agent refuses to say, and to whom.
attached_to: agent          # agent | model-deployment | toolbox
levels:
  hate: medium              # block at medium and above
  violence: medium
  sexual: medium
  self-harm: medium
prompt-shields:
  enabled: true             # jailbreak and indirect-injection detection on inputs
  rationale: >-
    The agent's input is a customer's free text and, through the catalogue, product names and
    descriptions. Both are untrusted: the text can attempt an injection outright, and catalogue content
    is data that must never be read as an instruction. The code delimiters catalogue content wherever it
    reaches a prompt; this catches what a delimiter does not.
grounding:
  rationale: >-
    The agent is required to compose from the catalogue and nothing else, so an answer that names a SKU
    the catalogue does not hold is a failure the application catches and this policy cannot. Kept here
    as a note of where that rule lives.
