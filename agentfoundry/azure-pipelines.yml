# Azure DevOps pipeline for the CoreRentalNet Foundry hosted agents.
#
# This is a SEPARATE pipeline from the application's (../azure-pipelines.yml). The two trees build
# and deploy differently — this one ships agents to Microsoft Foundry with `azd`, the application
# ships to App Service with a web-app deployment task — so they are separate entries with their own
# triggers, approvals and run history. Register this file as its own pipeline in Azure DevOps; the
# path filter below keeps it to the agent tree.
#
# Two stages:
#   CI     - restore, build and test agentfoundry/AgentFoundry.sln.
#   Deploy - `azd provision` then `azd deploy`, after a manual approval on the ADO Environment below.
#
# Decisions this file encodes:
#   - Provision, then deploy. azure.yaml pins the existing Foundry project, so `azd provision`
#     reconciles the declared model deployments into it and populates the project outputs the
#     agent services read; the two `azd deploy` calls then register new agent versions.
#   - Secretless. azd signs in with a workload identity federated token from the ARM service
#     connection; no client secret is stored anywhere.
#   - Configuration comes from the `core-rental-foundry` variable group, which must exist (with
#     the values listed below, including the service connection) before the first run. Nothing the
#     deployment can change is stored in this file.
#   - Both agents deploy, one at a time. `azd deploy` with no service name packages every service
#     concurrently, and both agent services share one project directory, so the two `dotnet publish`
#     runs race on the same obj/ path and one is killed. Naming the service keeps them sequential.

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - agentfoundry/**
      # The agent projects import the repository's Directory.Build.props and pin the SDK in
      # global.json, so a change to either can change the agent build.
      - Directory.Build.props
      - global.json
      # The version resolver and the stamping helper both live here.
      - scripts/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - agentfoundry/**
      - Directory.Build.props
      - global.json
      - scripts/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Create this group under Pipelines -> Library with:
  #   AZURE_SUBSCRIPTION_ID, AZURE_LOCATION, AZURE_AI_MODEL_DEPLOYMENT_NAME, AZURE_AI_PROJECT_ID,
  #   AZURE_AI_PROJECT_ENDPOINT, AZURE_SERVICE_CONNECTION (the agent tree's own ARM service connection),
  #   APPLICATIONINSIGHTS_CONNECTION_STRING, CATALOGTOOLS__MCPENDPOINT, DOTNET_ENVIRONMENT,
  #   ECHOAGENT__AGENTNAME, ECHOAGENT__ISENABLED
  # None of them is a secret. AZURE_AI_PROJECT_ID is the project's ARM resource id, not its endpoint;
  # see the note on `azd env set` below for why both exist.
  - group: 'core-rental-foundry'
  - name: buildConfiguration
    value: 'Release'
  - name: dotnetVersion
    value: '10.0.400'
  - name: solution
    value: 'agentfoundry/AgentFoundry.sln'
  - name: azdVersion
    value: '1.35.1'                                        # azure.yaml requires azd >= 1.27.1
  - name: azdEnvironmentName
    value: 'core-rental-foundry'
  # The environment the deployed artifact is stamped as. It is baked into the assembly rather than injected
  # at run time, so the running agent reports where it was built to run from its own metadata.
  - name: agentEnvironment
    value: 'production'

stages:
- stage: CI
  displayName: 'Build & Test'
  jobs:
  - job: BuildTest
    displayName: 'Restore, build, test'
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET SDK $(dotnetVersion)'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'
        includePreviewVersions: true

    - script: dotnet restore $(solution)
      displayName: 'Restore'

    - script: bash scripts/resolve-version.sh
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: 'Resolve version from the tag'

    # Foundry builds the deployed agent remotely from this folder, so the identity has to be inside it. The
    # generated file is gitignored and travels with the zip. CI names no environment: the artifact it builds
    # is tested, not deployed, and the deploy stage stamps the environment the deployment actually uses.
    - script: bash scripts/write-agent-version.sh "$(version)" "$(informationalVersion)" "$(shortSha)" "$(Build.BuildId)" ""
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: 'Stamp the agent project with the release version'

    - script: >-
        dotnet build $(solution)
        --configuration $(buildConfiguration)
        --no-restore
        -p:Version=$(version)
        -p:InformationalVersion=$(informationalVersion)
      displayName: 'Build (Release)'

    # The gate: every agent test must pass. There is no browser suite in this tree.
    - script: >-
        dotnet test $(solution)
        --configuration $(buildConfiguration)
        --no-build
        --logger "trx;LogFileName=agent-tests.trx"
        --results-directory $(Agent.TempDirectory)
      displayName: 'Agent tests'

    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/*.trx'
        searchFolder: '$(Agent.TempDirectory)'

# ---------------------------------------------------------------------------------------------
# Deployment. The Environment below carries a manual approval check, configured once in the ADO
# UI (Pipelines -> Environments -> core-rental-foundry-production -> Approvals and checks). The
# stage is created on a `main` push, pauses, and proceeds only when an approver releases it.
# Pull requests skip the stage entirely.
# ---------------------------------------------------------------------------------------------
- stage: Deploy
  displayName: 'Deploy agents to Foundry'
  dependsOn: CI
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - deployment: DeployAgents
    displayName: 'Deploy'
    environment: 'core-rental-foundry-production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          # The same resolution and stamp as the CI stage: the deploy stage has its own checkout, so the
          # generated Version.g.props is written again before azd zips the project folder.
          - script: bash scripts/resolve-version.sh
            workingDirectory: '$(Build.SourcesDirectory)'
            displayName: 'Resolve version from the tag'

          - script: bash scripts/write-agent-version.sh "$(version)" "$(informationalVersion)" "$(shortSha)" "$(Build.BuildId)" "$(agentEnvironment)"
            workingDirectory: '$(Build.SourcesDirectory)'
            displayName: 'Stamp the agent project with the release version'

          # azd resolves the services in azure.yaml, which needs the Foundry extensions. Versions
          # are resolved from the extension feed the same way a developer's machine resolves them.
          - script: |
              set -euo pipefail
              curl -fsSL https://aka.ms/install-azd.sh | bash -s -- --version $(azdVersion)
              export PATH="$HOME/.azd/bin:$PATH"
              azd extension install azure.ai.agents --yes --no-prompt
              azd extension install azure.ai.projects --yes --no-prompt
              azd extension install microsoft.foundry --yes --no-prompt
            displayName: 'Install azd and the Foundry extensions'

          # AzureCLI@2 resolves its connection before its script runs, so the service connection
          # cannot be checked from inside that script. An unresolved macro is passed through as the
          # literal `$(...)`, which a plain empty test would accept.
          - script: |
              set -euo pipefail
              value="${AZURE_SERVICE_CONNECTION:-}"
              case "$value" in
                ''|*'$('*)
                  echo "##vso[task.logissue type=error]Variable group 'core-rental-foundry' is missing AZURE_SERVICE_CONNECTION"
                  exit 1 ;;
              esac
            displayName: 'Check the deployment target variables'
            env:
              AZURE_SERVICE_CONNECTION: '$(AZURE_SERVICE_CONNECTION)'

          # Workload identity federation. azd has no `--federated-token` flag, so it is not handed a
          # token at all: `--federated-credential-provider azure-pipelines` tells azd to acquire the
          # token itself, and it reads the client id, tenant id and service connection from the
          # AZURESUBSCRIPTION_CLIENT_ID / _TENANT_ID / _SERVICE_CONNECTION_ID variables that
          # AzureCLI@2 exports when `addSpnToEnvironment: true` is set. With a secret-based service
          # connection instead, drop the provider flag and pass `--client-secret "$servicePrincipalKey"`.
          #
          # SYSTEM_ACCESSTOKEN is required by azd, not by the deployment: it builds an
          # azidentity.AzurePipelinesCredential and uses this OAuth token to reach the token service
          # at vstoken.dev.azure.com. YAML does not inject System.AccessToken on its own, so it has to
          # be mapped explicitly. It expires with the job and is never written to disk by azd.
          - task: AzureCLI@2
            displayName: 'Authenticate azd and deploy'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              workingDirectory: '$(Build.SourcesDirectory)/agentfoundry'
              inlineScript: |
                set -euo pipefail
                export PATH="$HOME/.azd/bin:$PATH"

                azd auth login \
                  --client-id "$servicePrincipalId" \
                  --federated-credential-provider azure-pipelines \
                  --tenant-id "$tenantId"

                # Fail fast with a clear message rather than letting azd read an unset value. These
                # come from the `core-rental-foundry` variable group; a macro ADO could not resolve
                # arrives as the literal `$(...)`, which is not empty, so both are rejected.
                for name in \
                  AZURE_SUBSCRIPTION_ID \
                  AZURE_LOCATION \
                  AZURE_AI_MODEL_DEPLOYMENT_NAME \
                  AZURE_AI_PROJECT_ID \
                  AZURE_AI_PROJECT_ENDPOINT \
                  APPLICATIONINSIGHTS_CONNECTION_STRING \
                  CATALOGTOOLS__MCPENDPOINT \
                  DOTNET_ENVIRONMENT \
                  ECHOAGENT__AGENTNAME \
                  ECHOAGENT__ISENABLED; do
                  value="${!name:-}"
                  case "$value" in
                    ''|*'$('*)
                      echo "##vso[task.logissue type=error]Variable group 'core-rental-foundry' is missing $name"
                      exit 1 ;;
                  esac
                done

                # .azure/ is not committed, so every run builds a fresh azd environment.
                azd env new "$AZD_ENVIRONMENT" --no-prompt
                azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
                azd env set AZURE_LOCATION "$AZURE_LOCATION"
                azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$AZURE_AI_MODEL_DEPLOYMENT_NAME"
                azd env set AZURE_AI_PROJECT_ENDPOINT "$AZURE_AI_PROJECT_ENDPOINT"
                # Required, and not derivable from the endpoint. It must be the ARM resource id, and it
                # must name the same project as the endpoint above or the extension rejects the pair as
                # mismatched. It is set here so the project is targeted before provisioning runs.
                azd env set AZURE_AI_PROJECT_ID "$AZURE_AI_PROJECT_ID"

                # Reconcile the model deployments azure.yaml declares into the pinned project and
                # populate the project outputs the agent services read. azure.yaml sets `endpoint:`,
                # so this connects to the existing project rather than creating one.
                azd provision --no-prompt

                # Variables the agent services read through azure.yaml `env:`. Without these the
                # deployed agents start with the setting empty.
                azd env set APPLICATIONINSIGHTS_CONNECTION_STRING "$APPLICATIONINSIGHTS_CONNECTION_STRING"
                azd env set CATALOGTOOLS__MCPENDPOINT "$CATALOGTOOLS__MCPENDPOINT"
                azd env set DOTNET_ENVIRONMENT "$DOTNET_ENVIRONMENT"
                azd env set ECHOAGENT__AGENTNAME "$ECHOAGENT__AGENTNAME"
                azd env set ECHOAGENT__ISENABLED "$ECHOAGENT__ISENABLED"

                # One service per call, not `azd deploy` bare. Both agent services point at the same
                # project directory, and an unqualified deploy packages them in parallel: the two
                # `dotnet publish` runs share obj/, which fails the second on a locked
                # rpswa.dswa.cache.json, and on a 2-core agent the concurrent publish is also what
                # gets one of them OOM-killed (`signal: killed`). Sequential calls avoid both.
                azd deploy core-rental-workspace-suggestion-agent --no-prompt
                azd deploy echo-reverse-agent --no-prompt
            env:
              AZD_ENVIRONMENT: '$(azdEnvironmentName)'
              SYSTEM_ACCESSTOKEN: '$(System.AccessToken)'
              AZURE_SUBSCRIPTION_ID: '$(AZURE_SUBSCRIPTION_ID)'
              AZURE_LOCATION: '$(AZURE_LOCATION)'
              AZURE_AI_MODEL_DEPLOYMENT_NAME: '$(AZURE_AI_MODEL_DEPLOYMENT_NAME)'
              AZURE_AI_PROJECT_ID: '$(AZURE_AI_PROJECT_ID)'
              AZURE_AI_PROJECT_ENDPOINT: '$(AZURE_AI_PROJECT_ENDPOINT)'
              APPLICATIONINSIGHTS_CONNECTION_STRING: '$(APPLICATIONINSIGHTS_CONNECTION_STRING)'
              CATALOGTOOLS__MCPENDPOINT: '$(CATALOGTOOLS__MCPENDPOINT)'
              DOTNET_ENVIRONMENT: '$(DOTNET_ENVIRONMENT)'
              ECHOAGENT__AGENTNAME: '$(ECHOAGENT__AGENTNAME)'
              ECHOAGENT__ISENABLED: '$(ECHOAGENT__ISENABLED)'
