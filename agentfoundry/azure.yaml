# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: agentfoundry

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'

services:
    ai-project:
        host: azure.ai.project
        endpoint: https://periang-foundry-demo-instance.services.ai.azure.com/api/projects/periang-foundry-demo-project
        # The deployment this agent runs on, declared exactly as it already exists so that provision
        # finds it correct rather than changing it. It MUST be a standard deployment: a run carries
        # ~172k tokens and gpt-4.1-mini's context is 128k on provisioned-managed and batch deployments.
        deployments:
            - name: gpt-4.1-mini
              model:
                  format: OpenAI
                  name: gpt-4.1-mini
                  version: "2025-04-14"
              sku:
                  name: GlobalStandard
                  capacity: 100
            - name: text-embedding-3-small
              model:
                format: OpenAI
                name: text-embedding-3-small
                version: "1"
              sku:
                name: GlobalStandard
                capacity: 100

    core-rental-workspace-suggestion-agent:
        project: src/CoreRentalNet.Agents
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        env:
            FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
            CATALOGTOOLS__MCPENDPOINT: ${CATALOGTOOLS__MCPENDPOINT}
            DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT}
            FOUNDRY_AGENT_INSTANCE_CLIENT_ID: ${FOUNDRY_AGENT_INSTANCE_CLIENT_ID}

            # FOUNDRY_AGENT_NAME is deliberately NOT mapped here: the hosting platform reserves the FOUNDRY_
            # prefix and injects the resolved agent name itself. Mapping it from an azd variable nobody set once
            # injected it empty, and an agent name that is present and empty is worse than one that is absent.
            # The name below and the injected name must agree; a deployment that renames one renames both.
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: CoreRentalNet.Agents.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Turns one sentence into workspace candidates drawn from the catalogue pushed with the request.
        displayName: Workspace Suggestions
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Responses Protocol
                - Agent Framework
                - .NET
        # The Foundry agent identity. Distinct from the service key above on purpose: the service key
        # names the folder and the azd service, the name is what Foundry resolves.
        name: core-rental-workspace-suggestion-agent
        protocols:
            - protocol: responses
              version: 2.0.0

    # A second agent service, because azd addresses azure.ai.agent SERVICES by their key in this file, not the
    # keyed agents inside a container. `azd ai agent invoke echo-reverse-agent "..."` therefore needs a service keyed
    # `echo-reverse-agent`; the container it runs is the same project, and the name below is what Foundry resolves.
    echo-reverse-agent:
        project: src/CoreRentalNet.Agents
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        env:
            # Which agent a request that names none gets. `azd ai agent invoke --local` sends no agent name and
            # `azd ai agent run <service>` does not pass the service name through locally, so the container has
            # to be told. Remotely the platform injects FOUNDRY_AGENT_NAME and the two agree.
            AGENTHOST__DEFAULTAGENTNAME: echo-reverse-agent
            ECHOAGENT__AGENTNAME: ${ECHOAGENT__AGENTNAME}
            ECHOAGENT__ISENABLED: ${ECHOAGENT__ISENABLED}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: CoreRentalNet.Agents.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: A test aid that replies with the reversed message it was sent, unchanged. No model, no catalogue.
        displayName: Echo Reverse Agent
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Responses Protocol
                - Agent Framework
                - .NET
        name: echo-reverse-agent
        protocols:
            - protocol: responses
              version: 2.0.0

infra:
    provider: microsoft.foundry
