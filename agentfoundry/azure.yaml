# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: agentfoundry

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'

services:
    ai-project:
        host: azure.ai.project
        endpoint: https://periang-foundry-demo-instance.services.ai.azure.com/api/projects/periang-foundry-demo-project
        # The deployment this agent runs on, declared exactly as it already exists so that provision
        # finds it correct rather than changing it. It MUST be a standard deployment: a run carries
        # ~172k tokens and gpt-4.1-mini's context is 128k on provisioned-managed and batch deployments.
        deployments:
            - name: gpt-4.1-mini
              model:
                  format: OpenAI
                  name: gpt-4.1-mini
                  version: "2025-04-14"
              sku:
                  name: GlobalStandard
                  capacity: 100

    workspace-suggestions:
        project: src/WorkspaceSuggestions
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: WorkspaceSuggestions.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Turns one sentence into workspace candidates drawn from the catalogue pushed with the request.
        displayName: Workspace Suggestions
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Responses Protocol
                - Agent Framework
                - .NET
        # The Foundry agent identity. Distinct from the service key above on purpose: the service key
        # names the folder and the azd service, the name is what Foundry resolves.
        name: core-rental-workspace-suggestion-agent
        protocols:
            - protocol: responses
              version: 2.0.0

infra:
    provider: microsoft.foundry
