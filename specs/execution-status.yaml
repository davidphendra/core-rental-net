notes: |
  e03 is complete: all three stories pass, and the catalogue endpoint now carries typed metadata on
  every product, a compact projection for a machine caller, and an envelope that says whether an
  answer is complete. e03 unblocks e02 and e04.

  e02s02 is complete: the suggestion contract (three schemas plus the C# records and vocabularies),
  the intent-classifier port, the verifier and the run that streams from it. The agent tree is
  agentfoundry/, with its own solution, and the application's baselines did not move - which is the
  property specs/adr/0001 exists to protect. The record is specs/verifications/e02s02-after.md.

  e02s03 is complete: the declared intent table (data, with a loader that refuses a row naming an
  unknown slot), the model fallback for a miss, the quantity rule clamped to the capacity the request
  carries, and the rephraser attached as the graph's second node. 17 agent tests pass. The record is
  specs/verifications/e02s03-after.md.

  e02s04 is complete: the catalogue reader port, the slot map, the price-position tier rule, pinning
  and its disclosure, the truncation refusal, and criteria mapped to tokens or reported unevaluated.
  25 agent tests pass. The record is specs/verifications/e02s04-after.md.

  e02s05 is complete, retry loop included. The blocker was that two typed edges leading into one
  executor do not both arrive - the framework binds the executor's input from the first edge and drops
  the second without a word - so one concrete message type, Round, now flows round the loop. 34 agent
  tests pass with none skipped. The record is specs/verifications/e02s05-after.md.

  e02s06 is complete: one record per run carrying the numbers the earlier decisions rest on, a span per
  run with an event per stage, and the structural form of the data-not-instructions rule asserted -
  catalogue text never crosses the contract at all. 38 agent tests pass. The record is
  specs/verifications/e02s06-after.md.

  e04s01 is complete: one ClaimRequirement carrying its own unconfigured behaviour, one handler
  answering four policies, the catalogue's rule preserved exactly and the AI section's two permissions
  closed by default. The security review carries an addendum, because this edited code it had already
  covered. The record is specs/verifications/e04s01-after.md.

  The stand-in agent is built and the risk it existed to retire is retired: the OpenAI package's
  Responses deserializers are internal, so the wire format cannot be read off the SDK - but a server
  written to the DOCUMENTED protocol and a client built through the application's own registration agree,
  including on the long result that arrives piecewise. Seven tests hold that, three hold the fixture's
  SKUs against the catalogue, and the browser suite now starts the stand-in before both hosts and points
  them at it. The record is specs/verifications/e04s03-stand-in-after.md.

  The agent client is decided and built. Research into Microsoft's own hosted-agent client samples
  settled it on evidence rather than shape: the sample's endpoint-taking AsAIAgent exists only in the
  framework's unreleased source, the released Foundry packages are beta and preview, and the OpenAI
  client's Responses surface is marked evaluation-only - which Microsoft's own sample suppresses, as
  this project does in one named place. The client chosen is the documented OpenAI-compatible one, with
  the application's own identity and a deliberately written guard. The record, including the three
  findings and the two corrections, is specs/verifications/e04s02-agent-client-after.md.

  e04s03 is delivered as far as it can be: the streaming contract on both sides of the port, the four
  rules applied to the last message of a stream, and the application's own words for the agent's stage
  ids. The section itself is not built, and neither is the stand-in - they are one chain, and the
  missing link is the Host adapter, which is the next step. 8 new tests; the record is
  specs/verifications/e04s03-after.md.

  e04s02 is delivered except for its two pieces that need something that does not exist yet: the Host
  adapter waits on e02s07's transport, and the local stand-in waits on e04s03's page. The rules
  themselves are in and asserted - catalogue prices, unknown SKUs dropped and reported, no padding,
  unavailability distinct from refusal. 5 new tests; the record is specs/verifications/e04s02-after.md.

  What remains in e02 is s01, the Auth0 spike, and s07, the deployment - both of which need a
  subscription and a login. Everything that can be built without one is built, and the two ports the
  deployment fills are IIntentClassifier, ISlotClassifier and ICatalogueReader. e02s01 - the Auth0 spike,
  the one hard gate - still needs a subscription and a login, and gates e02s03 onward only in the
  sense that the catalogue path it decides is wired at e02s07.

  e03s02 is complete: view=compact leaves out the image path and the display flags, states the price
  as a number and the currency once on the envelope, and keeps the description and the metadata. The
  record, including the document limitation the run exposed, is specs/verifications/e03s02-after.md.

  Next action: e03s03, total and truncated on the envelope.

  e03s01 is complete: the catalogue holds 140 products with a typed metadata record, published on
  ProductView, and all three baselines are green. The full record, including the five things the run
  corrected, is specs/verifications/e03s01-after.md.

  Next action: e03s02, the compact projection, whose field list is now decidable because metadata
  exists. e02 and e04 remain not-started; e02's auth spike is the gate for e02s03 onward.

  blind_spots and completeness_critic remain not run: the scripts do not ship in this repository.
