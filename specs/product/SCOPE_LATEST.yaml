# Scope of the MVP. Anything absent here is out of scope by default.
product: Core Rental
revision: 1
last_updated: 2026-02-12

in_scope:
  - "Browse a fixed catalog of 62 office SKUs (chairs, desks, extras)"
  - "Compose a workspace on a fixed-slot canvas (7 slots, max 9 units)"
  - "Server-side pricing; the monthly total is recomputed on every read"
  - "Delivery address capture (two-line textarea)"
  - "Demo checkout gated by typing 'this is a demo'"
  - "Order persistence, first invoice settled, cart reset, confirmation view"
  - "Rolling month-to-month: delivery scheduling, activation, monthly renewal invoicing, cancellation at the end of the paid period"
  - "Unit, integration, architecture and browser E2E tests with no mocks"
  - "CI workflow (committed now, dormant until a remote exists)"

out_of_scope:
  - "Authentication, accounts, identity provider, profiles"
  - "Admin or back-office UI, order queue, delivery dispatch"
  - "Real payments, Stripe, card data, refunds, dunning"
  - "Partner services (the motorcycle item was removed from the catalog)"
  - "Stock, availability, retired or inactive products"
  - "Deposits, proration, commitment terms, discounts"
  - "Multi-currency, multi-language"
  - "Drag-and-drop or free-form canvas placement"
  - "Email or notification delivery"
  - "Deployment automation and cloud provisioning (deferred, ADR-0014)"
  - "Load, penetration and accessibility audit testing"
