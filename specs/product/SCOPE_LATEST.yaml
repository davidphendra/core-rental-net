feature_name: ai-workspace-suggestions
core_value: >-
  A customer describes the workspace they want in words, and the builder answers with candidate
  workspaces drawn from the real catalogue - reviewed before they are shown, priced by the
  application, and applied to the draft only after the customer confirms.

summary: |
  This initiative has three parts, delivered in order.

  First the catalogue becomes worth matching against. Today it holds 62 products whose descriptions
  are one fixed phrase per slot, so a qualitative request like "a reliable monitor" matches nothing:
  the word "monitor" appears in 0 of the 8 monitors. The catalogue grows to 140 products (20 per
  slot) and every product carries a typed `metadata` record - tags, attributes, what it is best for
  and what it is not - which is what turns an unmatchable criterion into an exact one.

  Then a Foundry hosted agent learns to answer. Four agents run inside one Microsoft Agent Framework
  workflow in one container: a verifier that refuses anything that is not a workspace request, a
  rephraser that turns the request into a specification, a suggestor that reads the catalogue and
  composes three candidates across low, middle and high budget, and a reviewer that approves them or
  sends findings back. The agent is the only catalogue holder; the application is the only place
  that decides what a user may see.

  Finally the builder grows the feature itself: a permission-gated AI section, a streamed run whose
  stages are visible and cancellable, and a confirm-then-replace apply path. Selecting a candidate
  replaces the slots and preserves the delivery address; every SKU is validated against the
  catalogue before it reaches the page.

  This is a development and test initiative. It provisions Foundry resources in a throwaway resource
  group and does not deploy the application to production.

in_scope:
  - id: e03s01
    item: >-
      The catalogue holds 140 products - 20 per slot - and every product carries a typed metadata
      record (tags, attributes, bestFor, notFor) published on ProductView, so a criterion can be
      matched by tag or attribute instead of only by slot or product name.
  - id: e03s02
    item: >-
      A compact projection of the catalogue: the fields a machine caller reads, without the image
      and display flags it does not.
  - id: e03s03
    item: >-
      The catalogue envelope states how many products matched and whether the answer was truncated,
      so a caller can tell an incomplete answer from a complete one.
  - id: e02s01
    item: >-
      A time-boxed spike proving that a Foundry-hosted agent can read the catalogue as a machine
      with an Auth0 client-credentials token, with a written go/no-go and a pre-committed fallback.
  - id: e02s02
    item: >-
      The agent contract and the workflow skeleton: one container, the verifier, and a typed result
      streamed as stage events over the Responses protocol.
  - id: e02s03
    item: >-
      The rephraser: the declared intent table, the slot set, quantities bounded by the capacities
      the request carries, and a fallback that classifies into the closed SlotId enum and marks the
      result as inferred.
  - id: e02s04
    item: >-
      The suggestor: one catalogue read per request, the price-position tier rule per slot, slots
      with too few candidates pinned and disclosed, three candidates, and criteria mapped to the
      metadata vocabulary or returned as unevaluated.
  - id: e02s05
    item: >-
      The reviewer: a deterministic validator that gates every computable invariant, an LLM check of
      semantic alignment only, and a bounded retry loop whose exhaustion is a disclosed outcome.
  - id: e02s06
    item: >-
      Safety and observability: a content-safety guardrail on the agent, catalogue text treated as
      data, and one structured record per run carrying the outcome, attempts, call count, token
      count and whether the slot set was table-derived or inferred.
  - id: e02s07
    item: >-
      The hosted agent deployed: the container, the registry, the agent endpoint, the identity the
      application calls it with, and the configuration that names the model.
  - id: e04s01
    item: >-
      The AI section's own permission: an additive gate that needs the builder's existing catalogue
      permission too, refuses rather than opens when no identity provider is configured, and widens
      the number of candidates shown for an account that holds the power-user grant.
  - id: e04s02
    item: >-
      The application's side of the agent contract: a port, an adapter that calls the hosted agent
      with the application's own identity, and a local stand-in process so the suite stays hermetic.
  - id: e04s03
    item: >-
      The AI section in the builder: a field for the request and a streamed run whose stages are
      named by the application, announced politely, cancellable, and kept afterwards.
  - id: e04s04
    item: >-
      Every outcome rendered in the application's own words: candidates, a refusal, a run that
      exhausted its attempts, and a run that never arrived.
  - id: e04s05
    item: >-
      Choosing a candidate: the existing workspace is checked, replacement is confirmed, the whole
      composition is applied in one atomic write, and the delivery address is left alone.
  - id: e04s06
    item: >-
      One run at a time per account, so a double submit cannot spend a second run's worth of model
      calls.

out_of_scope:
  - item: Embeddings, vector search, RAG, or Azure AI Search over the catalogue.
    reason: deferred - typed metadata supplies the matching signal deterministically; an index would add a service, a reindex path and non-deterministic ranking. Revisit when descriptions are prose-rich, the catalogue is in the thousands, queries are cross-lingual, or criteria need attributes the metadata cannot express.
  - item: Per-user identity for the agent (OAuth identity passthrough, delegated consent).
    reason: not valuable - the catalogue is a public read; a shared machine identity holding read:catalog is the least privilege that works.
  - item: A hand-written MCP server, or publishing the Toolbox to a second consumer.
    reason: deferred - a second host is what would justify it, and the fallback in e02s01 may drop the Toolbox entirely.
  - item: Production deployment of the application or of the agent.
    reason: deferred - the repository has no deployment configuration and no production decision has been made.
  - item: Per-role models.
    reason: deferred - one model for all four; revisit when the live run's exhausted rate says the reviewer is the weak link.
  - item: Golden-query evaluation harness and continuous evaluation.
    reason: deferred - the first rows are captured by hand under specs/verifications; a dataset pays off once prompts change often.
  - item: Cursor pagination or nextLink.
    reason: not valuable - a defensive cap and a truncation signal are enough for a bounded in-memory snapshot.
  - item: Write access to the catalogue, and any change to the Catalog module's search semantics.
    reason: out of scope - the catalogue is an immutable snapshot and the store's name-only search is unchanged.
  - item: Fine-tuning, prompt optimisation, or agent evaluation pipelines.
    reason: not valuable - instructions plus structured output are sufficient at this size.
  - item: Payment, checkout, invoicing, or order-model changes.
    reason: out of scope - a suggestion only fills the draft; the funnel is untouched.

constraints:
  platform: .NET 10; Microsoft Agent Framework for .NET; one Foundry hosted agent running a four-agent workflow
  layout: the agent capability lives in agentfoundry/ with its own azd project and AgentFoundry.sln, separate from CoreRentalNet.sln; agent-owned Foundry resources are named agentfoundry-*
  auth: Auth0 machine-to-machine client credentials; the read:catalog permission and nothing else
  app_identity: the application calls the agent with its own identity - a developer credential locally, a managed identity when deployed - and stores no agent secret
  entitlements: read:catalog still gates the builder; read:aibuilder gates the AI section and fails closed when no identity provider is configured; poweruser:aibuilder widens the number of candidates and implies nothing on its own
  model: one model deployment for all four agents, named in configuration, because the gpt-4.1-mini family is deprecated no earlier than 2027-04-14
  contract: the only artefact shared by the two solutions is the suggestion contract schema under agentfoundry/shared/contracts/
  secrets: no secret in the repository; the credential the agent uses is held by configuration or a connection, never committed
  baselines: BUILD, NONBROWSER and BROWSER stay green; Foundry-dependent checks are opt-in live tests that skip without credentials
  provisioning: development and test only, in a throwaway resource group; the product owner has consented

success_criteria:
  - criterion: The catalogue can be matched on more than its slot.
    evidence: '"standing desk" resolves to an attribute and "quiet" to a tag, so those criteria are matched rather than reported unevaluated.'
  - criterion: An unrelated request is refused, not answered.
    evidence: a request about something other than a workspace returns rejected with a reason code and no candidates.
  - criterion: Three candidates differ across budget.
    evidence: 'a request for a monitor and a chair returns three compositions whose monthly totals differ, each naming SKUs that exist in the catalogue.'
  - criterion: The agent cannot read the catalogue without the permission.
    evidence: the same read with a client lacking read:catalog is refused 403 and the agent receives no products.
  - criterion: A model cannot invent a product.
    evidence: a candidate naming an unknown SKU never reaches the page; the application drops it and says so.
  - criterion: Applying a candidate is atomic and reversible.
    evidence: after confirming, the slots hold exactly the composition and the delivery address is unchanged; a version conflict applies nothing.
  - criterion: Only an entitled account sees the AI section.
    evidence: an account without read:aibuilder sees no AI section; with no identity provider configured, none is shown.
  - criterion: A run is legible and interruptible.
    evidence: stages appear as the run proceeds, a cancelled run applies nothing, and the stage list remains after the run ends.
  - criterion: Behaviour did not move.
    evidence: the three baselines are green and the builder still composes a draft by hand.

