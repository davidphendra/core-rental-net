risks:
  - id: r01
    title: The whole e05 replacement was carried as one uncommitted working tree
    severity: high
    status: mitigated
    what: >-
      The agent tree's new layout and the application's rebuild on top of it existed only as an uncommitted
      working tree: 245 files deleted, 46 untracked, 44 modified - 17,883 deletions against 479 insertions
      in tracked files alone, with the untracked half (two whole projects) not counted in that figure at
      all. It does not merely add: it removes and replaces work that IS committed on this branch, because
      e04's module-level design was committed before e05 superseded it. So the project's largest single
      change was invisible to git log, unreviewable as a diff, and one checkout away from being lost.
    evidence: >-
      Measured, not estimated: git status reported 245 deleted / 46 untracked / 44 modified, and
      git diff --stat HEAD reported 289 files changed, 479 insertions, 17,883 deletions. 803 tests passed
      against that tree, and they were the only evidence the replacement was sound.
    why_it_matters: >-
      Four separate record-versus-code mismatches were found in the same session that this risk was
      written - a permission that answered 500, a stop reported as a failure, a browser tier whose
      foundation had been deleted, and a fallback that named a framework API which does not exist. Every
      one of them was a document asserting something the code did not do. An uncommitted replacement is
      that same failure with no document at all.
    mitigation: >-
      Committed in slices with every slice's baseline recorded, and the boundaries - together with what
      each slice can and cannot prove on its own - written down in specs/COMMIT_PLAN_LATEST.md. The
      contracts that bind the two trees are the reason the application slice cannot be cut finer.

  - id: r02
    title: The branch is 24 commits ahead of main and has never been reviewed relative to it
    severity: medium
    status: open
    what: >-
      main is a strict ancestor of this branch, which carries 24 commits it does not have - e03's finish,
      e04's build, and e05's agent work. Nothing has been reviewed against main, and the uncommitted
      replacement on top of it removes part of what those commits added.
    evidence: >-
      git rev-list --count HEAD..main is 0 and git log --oneline main..HEAD lists 24 commits, ending at
      a62b2ec.
    mitigation: >-
      Not taken. It is a review question rather than a commit one, and it is recorded here so the next
      reader sees it before reading the history as though it had been agreed.

notes: |
  e01 and e03 are done. Their capsules were removed with the e05 restructure, so this plan is now the
  only place that status is recorded - and it previously disagreed with it, calling e03 planned. It no
  longer does.

  e05 replaces the two epics it supersedes - e02 (agentfoundry-suggestions) and e04 (ai-builder) -
  and they are removed from this index rather than left beside it. Both described a four-agent
  workflow in which the agent pulled the catalogue over the application's API; e05 is one capability
  with one contract: a two-agent sequential workflow on a pushed catalogue, with the application as
  the only place a price or a product name is resolved. The reasoning is specs/adr/0002, and the
  layout decision behind it is specs/adr/0003. The removed capsules remain in history at e02/e04.

  e05 depends on e03s02 for the compact projection it pushes, and on the catalogue the application
  already loads. Nothing in e05 needs Foundry for its offline tiers: the agent tier runs against a
  fake model client and the browser tier against a local stand-in that speaks the same protocol.

  Two constraints that are easy to lose and expensive to rediscover:
    - A run pushes the whole compact projection (~336 KB, ~86k tokens) on BOTH agent calls, so it
      carries roughly 172k input tokens per run.
    - gpt-4.1-mini fits that ONLY on a standard deployment (300k context). A provisioned-managed or
      batch deployment is 128k and the run would fail rather than degrade.

  Scoring, honestly: e05's WSJF of 4.0 is inherited from the epics it replaces and has NOT been
  re-scored. At 49 BCPs it is larger than either predecessor, so the number should be recomputed
  rather than trusted.

  Candidate totals must spread: the dearest at least 1.5x the cheapest, the factor held in
  configuration, applied to the range only - the middle is merely sorted between them. Where the
  catalogue cannot produce options that far apart, fewer candidates are shown rather than padded.

  Record-keeping, not a status change: a catalogue of 140 products was described in e03's capsule and
  echoed here. Commit a62b2ec stocked 205 (25 desk, 30 chair, 150 accessory) with vendored images, so
  that figure was stale, and it has been corrected wherever it still appeared. As for the scope
  document: specs/product/SCOPE_LATEST.yaml does not exist. It is a product statement to be authored by
  the product owner rather than reconstructed by engineering, and this initiative should not be planned
  in earnest until it is written.

  The e05 summary is 33 of 47 tasks passing (70.2%), 13 not started (27.7%) and 1 assumed but unproven
  (2.1%). The single assumption is e05s01 task 5, and it is now much narrower than it read: the client
  half is proven offline - the schema travels as the Responses protocol's own text.format json_schema,
  with no synthetic tool - so what a deployment still settles is only whether gpt-4.1-mini honours it.
  The account is in specs/epics/e05-ai-workspace-builder/e05s01-tasks.yaml. The two corrections that
  produced it are in the same file: the fallback task 5 named does not exist in the pinned framework,
  and the three-calls figure it stated had no derivation.
