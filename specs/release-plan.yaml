notes: |
  e01 is done. The three epics after it are one initiative with a strict internal order.

  e03 comes first even though its WSJF is unremarkable, because it is a prerequisite: the agent
  cannot match a request against a catalogue whose only discriminating text is a product name. Its
  value is a precondition rather than a return, which is exactly what a WSJF ordering alone would get
  wrong.

  e02 and e04 share order 3 in effect and may run in parallel. Their only coupling is the suggestion
  contract schema under agentfoundry/shared/contracts/, and the browser tier of e04 is driven by a
  local stand-in process, so e04 does not wait for Foundry provisioning.

  e02 carries the risk: 36 BCPs, a four-agent workflow, and one hard gate - e02s01, the Auth0 spike,
  which decides between a Toolbox OpenAPI tool and the pre-committed fallback in which the container
  mints its own token. Everything else in e02 can be built and unit-tested while that gate is open.

  Scope is specs/product/SCOPE_LATEST.yaml. The 52 decisions these epics implement are recorded in
  their epic.yaml notes by register id; the layout decision behind them is specs/adr/0001.
