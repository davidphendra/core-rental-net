found_while_verifying:
  - "aria-disabled rendered the text True.ToString().ToLowerInvariant(), because Razor closes an implicit expression at the first unparenthesised method call. Four other attributes had the same latent shape."
  - "The suite's readiness signal matched prerendered markup, so clicks landed before the circuit attached."
  - "/builder?empty=1 cannot bind to a bool; the redirect had been returning a server error since E3."
  - "The fixture started the application from its build output directory, where a development build has no static assets: every stylesheet, font and vendored image was a 404 while every test passed."

deviations:
  - "No bUnit component tests, as decided. The browser suite covers the components that matter, and a component test would mostly restate it."
  - "No axe gate, as decided. The suite asserts what is cheap and unambiguous instead: every visible control is a real element with a name, and the dialog is native."
