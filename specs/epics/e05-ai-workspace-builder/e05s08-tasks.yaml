# TASKS 1 TO 3 ARE BUILT: the trust boundary. `SuggestionValidator` is where an agent's answer becomes an
# application fact or becomes nothing at all, and the section now reads the validated frame - names, amounts,
# totals and labels resolved here - rather than the agent's own result, which e05s07 recorded it would replace.
#
# TWO THINGS THE STORY DOES NOT SETTLE, DECIDED HERE AND FLAGGED RATHER THAN QUIETLY CHOSEN.
#
#   1. WHAT "FEWER ARE SHOWN" MEANS WHEN THE RANGE FAILS. Implemented as ONE candidate, and that is provable
#      rather than a preference: no subset of two or more can satisfy a range the whole set fails, because
#      dropping the cheapest raises the minimum and dropping the dearest lowers the maximum, so either makes
#      the range narrower. WHICH single candidate is shown is the part the record does not say. This shows the
#      CHEAPEST, on the grounds that it is the affordable end and the honest one when no range could be
#      offered. The alternative reading - the middle, as the neutral one - is equally defensible.
#
#   2. WHAT "LABELLED BY RANK" MEANS FOR FEWER THAN THREE. Implemented literally: the Nth cheapest takes the
#      Nth label, so two candidates are Budget and Balanced, and one is Budget. The alternative reading labels
#      by position in the set - two candidates would be Budget and Premium, and one would be Balanced - which
#      is what makes a single candidate read sensibly and is what a reader of the page might expect. Both were
#      considered; the literal one was taken because the story says "by rank". FLAGGED FOR THE PRODUCT OWNER,
#      because AIWB-34 says "three, two and one are each labelled correctly" and "correctly" is the one word in
#      that row the record does not define.
#
# A THIRD THING IS UNGUARDED AND RECORDED. The result contract bounds a result at three options; nothing on
# this path enforces it, and the labelling is written as a function rather than a list so a fourth cannot be an
# out-of-range exception. Enforcing the bound would be a validation rule the story does not list, so it was not
# added - it is named here instead.
#
# THE CODING STANDARD CAUGHT THE FIRST DRAFT. `CodingStandardTests` failed on a 44-line method - the per-line
# check and the per-option check were one method - which is a rule this repository enforces by test rather than
# by review. Split into `TryRead` and `TryPrice`.

# TASK 4 IS BUILT: `ReplaceComposition`, one atomic versioned write that touches the composition only.
#
# Four things make it what the story asks for, and each is asserted rather than implied:
#   - ONE WRITE. The repository is asked once, so a caller can never observe a workspace that is half the old
#     setup and half the new one. Doing this as a remove followed by a series of adds would be several writes.
#   - THE VERSION IS CHECKED BEFORE ANYTHING IS WRITTEN. The caller read a version, decided what to put in its
#     place and came back; if the draft moved in between, the replacement is refused rather than merged.
#     Merging would silently discard whatever the customer did while the suggestion was being drawn - the one
#     thing they would never think to check. `Version` is also a real concurrency token (DraftEntityTypeConfiguration),
#     so a write that RACES this one is refused by the database rather than by a check that could be stale.
#   - THE ADDRESS IS NOT MENTIONED. A composition is not an address: a customer who asked for a different setup
#     did not ask to be re-addressed. The mechanism is that nothing here refers to it; the contract is a test.
#   - NOTHING IS WRITTEN UNTIL EVERY LINE IS CHECKED, so a composition that does not fit leaves the draft
#     holding what it held, and a line below one is refused - the bound nothing upstream enforces.
#
# IT IS A SERVICE OF ITS OWN, AND THE CODING STANDARD DECIDED THAT. Adding it to `IWorkspaceService` put
# `WorkspaceService.cs` at 184 lines against a budget of 150, which `CodingStandardTests` failed on. The rule
# the split follows is the repository's own: one public operation per service. Everything on `IWorkspaceService`
# changes one thing about a workspace; this replaces the whole of what it holds.

# AIWB-16 ("a valid agent result maps to candidates with prices recomputed from the catalogue") arrived here
# from e05s05, which stops at the agent's typed result. Recomputing a price from the catalogue is the same
# act as rejecting a candidate whose SKU is not in it, so it belongs with the all-or-nothing validation in
# task 2 rather than beside the adapter.
