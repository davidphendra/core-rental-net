# TASKS 6 AND 7 WERE ADDED, NOT SCHEDULED, AND THE REASON IS RECORDED. Task 5 is where the epic intended to
# "record the model call count", and reading the contract while preparing that deploy showed the call count
# could never have been measured: usage was a REQUIRED field of the result the model produced, the suggestor
# prompt never mentioned it, and no code filled it. Only a deployment would have exposed it, and what it
# would have exposed is a model inventing five numbers that validation accepts. Every offline fixture wrote
# "usage" by hand, which is why three passing stories never saw it.
#
# Task 6 is built. Task 7 is the other half of the same decision and is NOT built: the answer cannot carry
# usage inline the way it does now, because the model's JSON is streamed verbatim and the deltas are gone by
# the time anything holds the finished response. The shape changes in both trees, which is why it was
# settled before deploying rather than discovered after.
#
# ================================================================================================
# TASK 5 HELD TWO UNVERIFIED CLAIMS, NOT ONE, AND THE SECOND IS NOW REFUTED. Corrected at e05s07 after
# being checked rather than assumed - the same rule the task exists to enforce, applied to the task itself.
#
# REFUTED: `UseStructuredOutput` DOES NOT EXIST. Searched every method, public and non-public, of
# Microsoft.Agents.AI, Microsoft.Agents.AI.Abstractions and Microsoft.Agents.AI.OpenAI in the pinned set
# (1.20.0 / 1.21.0), and every assembly and XML document in the package cache: no member, no string. The only
# structured-output type in the framework is an internal `StructuredOutputSchemaUtilities`. The fallback this
# task named was a claim about different documentation, and it was never adoptable.
#
# ALSO WRONG: the arithmetic. Rephraser declares `ForJsonSchema<WorkspaceSpec>()` and Suggestor declares
# `ForJsonSchema<SuggestionResult>()`, so a fallback applied per agent costs FOUR calls, not three. The "three"
# had no derivation anywhere in the record.
#
# AND MOST OF THE ASSUMPTION WAS NEVER DEPLOY-ONLY. Measured offline at e05s07 through the real client against
# a stand-in on a real socket: the schema IS put on the wire, as the protocol's own field -
# `text.format = { type: "json_schema", name: <contract>, schema: {...} }` - with `tools` EMPTY. So structured
# output is the format rather than a synthetic tool call, and no middleware was ever needed for the client
# half. Guarded by `StandInTransportTests`, which holds the PRODUCTION client against the wire rather than a
# rebuilt replica. That half of this task is now proven and no longer assumed.
#
# WHAT REMAINS, AND WHY IT IS STILL PINK: `strict` is ABSENT from the format, so the API does not enforce
# conformance. Whether gpt-4.1-mini returns a conforming object is therefore a real question and only a
# deployment answers it - but the consequence is bounded, because a non-conforming answer is refused when the
# result is read (AIWB-03) and validated as a whole before anything is rendered (e05s08). If the answer is
# "no", the repair is ours: validation-driven retry, or plain-text prompting with the reader's existing
# tolerance. It is NOT a switch, and it does not change the call count by arithmetic - it changes it by
# whatever we build.
#
# CONSEQUENCE FOR THE COST: p95 <= 30 s and the measured per-run cost were computed from TWO calls, and
# nothing in this correction moves that. The figure stands on the design's shape - two agents, both carrying
# the whole projection - rather than on the fallback that was mis-stated.
