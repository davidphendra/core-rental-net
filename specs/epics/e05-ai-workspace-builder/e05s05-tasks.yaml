# TASK 6 ADDED BY THE e05s01 DECISION. The application parses the agent's answer, so the moment the answer's
# shape changes this story is involved whether or not anyone wanted it to be. NOT built yet.
# AIWB-16 ("a valid agent result maps to candidates with prices recomputed from the catalogue") was listed
# against this story and does not belong to it: this story stops at the agent's typed result, and the mapping,
# the catalogue look-up and the recomputed price are the validation story. AIWB-16 now sits against e05s08.
# The matrix was corrected rather than the scenario being claimed twice.
#
# AIWB-47, honestly: there is no session argument in the call and no session field on the adapter, so a session
# cannot be carried - but that is a property of the code's shape, not something a test observes. What the test
# DOES observe is the consequence: two identical runs send byte-identical payloads, so nothing from the first
# run reached the second. Recorded here so the scenario is not read as a stronger claim than it is.
#
# Verify command 3 was written against a SuggestionSessionTests file that was never created; the assertion
# lives in SuggestionAgentTests, and the command was corrected to the file that exists.
#
# ================================================================================================
# A REGRESSION FOUND AT e05s07 TASK 4, IN THIS STORY'S CODE, AND RESTORED. RECORDED HERE BECAUSE THIS
# STORY IS MARKED PASSING AND THE RECORD HAS TO SAY SO BEFORE ANYTHING ELSE IS CLAIMED.
#
# This story replaced the agent client with `AIProjectClient` + `DefaultAzureCredential`, and in doing so it
# silently dropped the OTHER HALF of the design it replaced. What was there before, in the root
# `Directory.Packages.props` and in `FoundryAgentRegistration`, was two paths chosen by scheme:
#
#     Deliberately NOT Azure.AI.Projects, which is beta, nor Microsoft.Agents.AI.Foundry, which is preview:
#     the hosted-agent sample that uses them is the SHAPE to follow, not the packages.
#
#     A local endpoint is reached over http with a placeholder api key and no credential at all; a Foundry
#     project is reached over https with a token from the application's own identity.
#
#     ... This is the hermetic tier's path: no credential, no token and no TLS, which is why it can run in a
#     test suite.
#
# The replacement kept only the credential path, and the record went on asserting the other one: the epic's
# rollout note says "the browser tier runs a local stand-in that speaks the same protocol", and the test
# matrix's whole browser level is "the Playwright suite against ... the local stand-in ... no mocks, no
# intercepted calls". With one path, every browser scenario in this epic is unbuildable - e05s07 tasks 4, 5 and
# 6, e05s08's browser task, e05s09's AIWB-41, and sixteen rows of the matrix - while the plan still reads as
# though they are not.
#
# THE PATH CANNOT BE RECOVERED THE OTHER WAY, AND THAT WAS MEASURED RATHER THAN ARGUED. Handing the project
# client a plain-http endpoint fails at the first request with:
#
#     InvalidOperationException: Bearer token authentication is not permitted for non TLS protected (https)
#     endpoints.   (System.ClientModel.Primitives.BearerTokenPolicy)
#
# So no credential can be presented to a stand-in, and the two paths really do part at the scheme. The pre-
# existing comment had said exactly that - "it will not send a bearer to plain http" - and it was correct.
#
# RESTORED, with no change to the package set: `SuggestionAgentSettings.IsLocal()` decides by scheme, and
# `FoundryAgentFactory` branches. The local path uses the OpenAI-compatible Responses client the graph already
# resolves (OpenAI 2.12.0 and Microsoft.Extensions.AI.OpenAI 10.6.0, both transitive through the Foundry
# package), wrapped by `ChatClientAgent` from Microsoft.Agents.AI. Its `OPENAI001` evaluation-only marker is
# suppressed one expression wide, with the reason written there - that marker is the price of this path, and
# it is now named where it is paid rather than discovered later.
#
# Guarded by `StandInTransportTests`, which drives the REAL adapter through the REAL client at an in-process
# stand-in over a real socket with no credential, and asserts the result was read rather than the specification
# that arrives before it. That assertion is not ceremony: it is the adapter's most expensive lesson, and it had
# only ever been tested against a substituted AIAgent.
#
# STILL OPEN, and the next slice: the shared stand-in as its own project in the test tree (with the scenario
# switch a test chooses an answer with, and its bodies rewritten for THIS contract - the old ones speak
# `kind`/`stage` messages and `ok`/`exhausted`/`rejected` with tiers, none of which this contract has), and the
# host wiring that points the authenticated E2E host at it. Only then are e05s07's tasks 4 to 6 buildable.
