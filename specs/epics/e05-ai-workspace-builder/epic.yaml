id: e05
slug: ai-workspace-builder
title: The AI workspace builder
status: planned
bcps: 49

deltas:
  - type: ADDED
    what: >-
      A Foundry hosted agent - one deployable on gpt-4.1-mini, running a two-agent Microsoft Agent
      Framework workflow, rephraser then suggestor - that turns one sentence into workspace candidates
      drawn from the catalogue pushed with the request. It states SKUs, quantities and purpose only: no
      price, no product name. Beside it, a permission-gated AI section in the builder: a request field,
      a streamed run whose text the customer reads as it is produced and whose stages the application
      words, candidates labelled by rank, and a confirm-then-replace apply path that leaves the
      delivery address alone.
  - type: MODIFIED
    what: >-
      How entitlement is decided. One parameterised claim requirement carrying its own unconfigured
      behaviour replaces the catalogue-specific one, so the AI permission can be declared without
      copying the matching rule. The catalogue's own behaviour - open when no identity provider is
      configured - is unchanged, while the AI permission is closed when unconfigured.

