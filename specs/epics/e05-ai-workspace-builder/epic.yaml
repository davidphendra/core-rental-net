notes: |
  HOW PROGRESS IS REPORTED AND RECORDED (agreed with the product owner; this is the standard, there is no
  other):

  Vocabulary is the plan's own, and nothing else. Work is named by story (`e05sNN`) and task number
  (`e05s01` task 3). Ad-hoc labels invented in conversation - "R1", "Q7", "the offline half" - are not used,
  are not recorded anywhere, and must be recognised as noise if they appear. When a choice is needed it is
  put as plain numbered options inside the question and never referred to again afterwards.

  Status values, four and only four, and every task carries one in its own tasks file: planned,
  in-progress, passing, failing. A story's status in this file is the roll-up of its tasks and is one of
  planned, in-progress, passing, failing.

  After any task is completed, the report is three things: (1) what was done, by story and task id, one
  line each; (2) the epic's percentage split across FOUR MUTUALLY EXCLUSIVE BUCKETS over all 43 tasks -
  done, in progress, not started, and assumed-but-unproven; (3) anything still assumed and what it needs.
  The buckets sum to 100%.

  "Assumed but unproven" means believed and not yet demonstrated by a run or a test. It is NOT "needs the
  product owner's decision": the design holds no open questions. A task in that state carries the marker
  `assumed: true` in its tasks file, which is what the bucket counts - so the number is read from the record
  rather than judged in prose. Today the single assumed task is `e05s01` task 5, the live structured-output
  probe, which only `azd deploy` can settle.

  THE RECORD IS THE SOURCE OF TRUTH, NOT THE PROSE. A task is only reported done because its tasks file
  says `passing`. If the two disagree, the file is stale and is corrected before anything else is said.

  Implements specs/adr/0002 (the builder) and specs/adr/0003 (the layout).

  PAYLOAD: the whole compact projection is pushed, Description included - measured at ~336 KB, ~86k
  tokens - and both agents see it, so a run carries roughly 172k input tokens. Trimming, a per-slot
  shortlist, and an agent-side tool were each considered and rejected; the reasoning is ADR 0002.

  MODEL: gpt-4.1-mini. Its context is 1,047,576 but 300,000 on a standard deployment against 128,000
  on provisioned-managed and batch deployments, so this run fits ONLY on a standard deployment. Target
  p95 <= 30 s with a 45 s HARD TIMEOUT - above the target, so a slow-but-correct run finishes rather than
  being cut at the number it was allowed to reach. No monetary ceiling; tokens, model and model-call
  count are recorded so the evaluation
  tier sets the per-customer cap from measurement, and no numeric cap exists before then.

  THE MODEL DEPLOYMENT, VERIFIED AGAINST THE SERVICE RATHER THAN ASSUMED. The account
  periang-foundry-demo-instance holds three deployments and this is what listing them returned:
  gpt-4.1-mini (gpt-4.1-mini 2025-04-14, GlobalStandard, capacity 100, Succeeded), gpt-5-mini
  (2025-08-07, GlobalStandard, capacity 50) and text-embedding-3-large (Standard, 120). Only the first
  is this design's. GlobalStandard is the SKU the design calls a standard deployment, which is what the
  ~172k-token run needs.

  A DEPLOY WOULD HAVE FAILED FOR THE WRONG REASON, AND THE ENV WAS CORRECTED. The azd environment
  carried AZURE_AI_MODEL_DEPLOYMENT_NAME="gpt-5.4-mini" - a deployment that exists NOWHERE: not in the
  account, and not once in the repository. agentfoundry/azure.yaml passes that variable into the agent's
  environment, and AgentRegistration.BuildChatClient reads it as REQUIRED, so the deployed agent would
  have been bound to a model that is not there and the very first call would have failed. The live probe
  for e05s01 task 5 would then have failed for a reason with nothing to do with structured output, at the
  cost of a provision and a deploy. It looked like residue from azd ai agent init that was never corrected.
  The product owner chose gpt-4.1-mini - the committed declaration and the recorded design - and the azd
  environment was set to match.

  THE THROUGHPUT CEILING IS BELOW WHAT ONE RUN PUSHES, AND THE DECISION IS TO MEASURE RATHER THAN RAISE IT.
  Read from the service, gpt-4.1-mini's deployment allows 100,000 tokens per 60 seconds and 100 requests
  per 60 seconds. A run pushes the whole compact projection twice, ~86k tokens per call, ~172k per run, so
  the second call exceeds the minute's allowance. Three ways out were put to the product owner: raise the
  deployment's token quota (GlobalStandard bills per token, so it is a quota change rather than a spend),
  measure first and decide from evidence, or reshape the workflow so only the suggestor sees the catalogue.

  THE PRODUCT OWNER CHOSE TO MEASURE FIRST, with the quota left at 100. The probe therefore runs as the
  design stands and records the true token counts, whether dynamic throttling lets the burst through, and
  whether retries breach the 45 s timeout. The point of choosing this way round is that the other two
  options then become decisions made on measurement instead of on arithmetic. It was accepted with the risk
  stated: throughput trouble may make the structured-output answer harder to read.

  THE RUN'S COST WAS A REQUIRED FIELD THE MODEL COULD NOT KNOW, AND THE DECISION IS THAT CODE COUNTS IT.
  suggestion.result.schema.json required usage on every result - modelCalls, inputTokens, outputTokens,
  model, promptVersion - and described the call count as one that "can never drift unnoticed". The suggestor
  prompt never mentioned it (grepped: no occurrence of usage, modelcalls or tokens) and no code populated
  it, so the ONLY party asked for those five facts was the one party with no way to observe any of them. A
  live run would therefore have had the model invent them, and validation would have passed, because
  integers are integers. Every offline fixture wrote "usage" by hand, which is why nothing caught it - the
  same class of gap as TerminalJsonObject going untested with two objects.

  The product owner chose the first of three options: the agent's code attaches it. Facts are now OBSERVED
  or CONFIGURED and never guessed - the call count and token counts are counted from the framework's own
  reports as the calls are made, and the model name and prompt version are configuration. VERIFIED BEFORE
  BUILDING, from the pinned packages: Microsoft.Agents.AI.AgentResponse.Usage exists, MAF ships
  UsageAggregator and ApplyAggregatedUsage, and Microsoft.Extensions.AI.DelegatingChatClient takes an inner
  client - but ChatResponseUpdate has NO Usage property, so on the streamed path the figure arrives as a
  UsageContent inside the update's contents. Both paths are handled because of that, and the recorder says so.

  BUILT SO FAR - the counting half, which is the half that makes the facts observable:
  Usage/UsageRecorder (thread-safe counts, saturating at the contract's integer ceiling), Usage/RunUsageScope
  (ambient, because the chat client is built once and shared, so a counter on the client would bill one
  customer's tokens to the next) and Usage/UsageRecordingChatClient (counts the call even when the client
  reports nothing). 20 tests, all offline.

  STILL OUTSTANDING, and not to be reported as done: usage is REMOVED from the model-facing schema, the
  agent appends it to the answer, and the application reads it. The answer cannot carry it inline the way it
  does now, because the model's JSON is streamed verbatim and the deltas are gone by the time any wrapper
  holds the finished response - so the shape has to change in both trees, which is why the earlier decision
  was to settle it BEFORE deploying rather than deploy twice. That work touches e05s01, e05s03 and e05s05,
  all three currently passing, and they will be re-opened with the reason recorded rather than quietly widened.

  COVERAGE IS NOW A MEASUREMENT. The repository had NO coverage tooling at all - no coverlet, no collector,
  nothing in CI - so "90%" could not have been claimed before now. coverlet.collector 6.0.4 is referenced by
  the agent test project (test-only, and inside the self-contained agent tree so it never touches the
  application's package policy). The agent project measured 89.7% line / 100% branch, with the gaps being
  Program at 0% (the host entry point) and AgentRegistration at 55.2%; covering the composition - the part a
  deployment actually depends on - took it to 94.6% line / 94.4% branch. Those tests found one real defect:
  a whitespace-only setting was treated as a value and surfaced as a UriFormatException instead of naming
  the setting nobody set, which Required now trims. The APPLICATION's own coverage has NOT been measured:
  it is a far larger surface and needs the same collector added before any target is promised for it.

  THE CONTRACT HALF IS BUILT. The model's result no longer carries usage at all - suggestion.result.schema.json
  dropped it, so a model CANNOT claim what a run cost even by guessing a plausible shape, and a test proves it
  is rejected. The run's cost follows the answer as its own object under a new contract,
  run-usage.schema.json, written by UsageReportingAgent: a delegating agent that opens the counting scope,
  runs the workflow inside it, and appends the report once the counts are complete. It is appended rather than
  merged because the model's JSON is streamed verbatim and a figure added afterwards cannot be injected into
  an object already sent.

  THE APPLICATION STOPPED GUESSING WHICH OBJECT IS WHICH. Reading "the last top-level object" stopped being
  true the moment the cost was appended after the result, and reading the FIRST would return the rephraser's
  specification. Deserialising each object and keeping the one that succeeds was rejected for a sharper
  reason: an enum with a missing value deserialises to its FIRST member, so an object carrying no status at
  all would have passed quietly as a suggestion. The adapter now selects by property - the result is the
  object with a status, the cost is the object with a runUsage - and TerminalJsonObject became ResponseObjects,
  because a name saying "the last one" would have outlived the rule it described.

  TWO SMALLER THINGS RECORDED FOR ACCURACY. The reported promptVersion is now BOTH prompts joined
  ("rephraser.v1+suggestor.v1"), derived from the prompt file names rather than written down twice - a run is
  two agents, and naming only the suggestor would understate what ran. And the default encoder writes '+' as
  \u002B; it decodes back correctly, so the test asserts the decoded value rather than the bytes, and the
  escaping is cosmetic rather than a defect.

  A REAL ALTERNATIVE WAS FOUND WHILE FRAMING THAT QUESTION, AND IT IS RECORDED RATHER THAN DISCARDED.

  WHAT THE 90% TARGET ACTUALLY MEASURES, AND WHERE IT CANNOT BE MET. The agent project is at 94.6% line /
  94.4% branch and that target is met. The APPLICATION is at 75.2% merged across every test project that
  runs in-process, and the gap is not scattered - it is the USER INTERFACE. The lowest classes are all Razor
  components at 0%: Builder, Review, Store, OrderConfirmation, Profile, SlotView, SlotCanvas,
  SlotPickerDialog, SlotCss. They are exercised, thoroughly, by the browser tier - 104 Playwright tests -
  but that tier drives the application as a SEPARATE PROCESS, so its coverage is not collected and every
  component it proves reads as untouched. Measuring one test project against the whole assembly gives 49.7%,
  which is an artefact of attribution rather than a fact about the code.

  So 90% for the application is NOT reachable by writing more unit tests, and trying would mean duplicating
  in xunit what Playwright already proves about a rendered page - more tests that assert less. The honest
  routes are to instrument the browser tier's server process so its coverage counts, and to exclude EF
  migrations and the OpenAPI source generator from any figure, since they are generated rather than written.
  Neither is done, and no application-side target is claimed until one of them is.
  prompts/rephraser.v1.md forbids naming any SKU, brand, product name or price and tells the agent that
  everything it may name is in the request - which the SEVEN-ENTRY slot vocabulary satisfies on its own. So
  the rephraser does not need 205 catalogue items and only the suggestor does. Narrowing the rephraser's view
  would bring a run to ~87k tokens, inside the ceiling, and roughly halve the per-run cost. It was NOT taken
  now because it is not a configuration change: under default chaining the second call inherits the ORIGINAL
  input, which AIWB-10 asserts by requiring the suggestor's request to carry the catalogue, so narrowing
  "the request" wholesale breaks that test. Doing it properly reshapes e05s03's workflow - a story that is
  passing - and belongs in its own change, after the measurement says whether it is needed.

  UNPROVEN ASSUMPTION, MOSTLY PROVED AND CORRECTED AT e05s07: the design assumed
  ChatResponseFormat.ForJsonSchema<T>() might not work on the RESPONSES path for gpt-4.1-mini, and named
  MAF's UseStructuredOutput middleware as the fallback. Both halves of that were wrong. The middleware does
  not exist in the pinned framework - no member, no string, in any of the three MAF assemblies or the package
  cache - and the schema does travel on the wire, as the protocol's own text.format json_schema with tools
  empty, which was measured offline through the real client against a stand-in rather than argued. What a
  deployment still settles is only whether the MODEL honours the format, and it is not enforced (no `strict`),
  so a non-conforming answer is possible and is absorbed by contract validation and the reader's tolerance.
  The three-calls-instead-of-two figure is withdrawn: it had no derivation, and both agents declare a schema,
  so a per-agent fallback would be four. The two-call basis for the p95 <= 30 s target is unaffected.

  THE APPLICATION SUITE HAD NOT BEEN RUN UNTIL e05s05, AND THAT HID A REAL FAILURE. The agent tree landed
  at e05s01, and the application's `PackagePolicyTests` scans every `.csproj` under the repository root -
  so "package versions live in Directory.Packages.props only" had been failing for three stories without
  anyone seeing it, because only `agentfoundry/AgentFoundry.sln` was being run. The agent tree pins its own
  versions on purpose (ADR 0003: no central file, released by Microsoft's tooling on Microsoft's cadence),
  so the test now excludes `agentfoundry/` and says why. From here on both solutions are run: the
  application suite is 686 passed / 1 skipped, the agent suite 28 passed, and both are offline.

  SESSION RULE, STATED AS WHAT IT IS. e05s05 passes no session to the hosted agent and holds none, so a
  session cannot be carried between customers - but that is a property of the code's shape, not something a
  test observes. AIWB-47 was reworded to match what is actually asserted (two identical runs send identical
  payloads), rather than left reading as a stronger claim than the test makes.

  AIWB-16 WAS LISTED AGAINST THE WRONG STORY and now sits against e05s08: recomputing a price from the
  catalogue is validation, and e05s05 stops at the agent's typed result.

  THE WIRE WAS CAPTURED AT e05s04, NOT ASSUMED, AND IT IS NOW THE REFERENCE FOR TWO LATER STORIES. A
  throwaway probe ran the real host over the real workflow with the scripted model client and dumped the
  SSE; the probe was then deleted. What it settled:

  1. The response is TWO TOP-LEVEL OBJECTS, the rephraser's specification first and the suggestor's result
     last, arriving as response.output_text.delta on SEPARATE message items (item_id differs; output_index
     3 then 10). The boundary between the two agents' answers is explicit on the wire.
  2. They are joined by a newline, so the application reads a SEQUENCE of values, not one document. The
     application's TerminalJsonObject and the reader both use AllowMultipleValues for this reason. With
     isFinalBlock: false a second top-level value is otherwise REJECTED - verified, it throws - so this is
     not a detail either could have got wrong quietly.
  3. Truncated input stops cleanly and never throws, mid-string, mid-escape or mid-object. The reader
     therefore re-scans from the start on every fragment instead of resuming mid-token.
  4. workflow_action items with kind "InvokeExecutor" and action_id rephraser_<hex> / suggestor_<hex>,
     status in_progress then completed, are on the wire. These are the stage identities e05s07 needs.
     WHETHER MAF's FoundryAgent SURFACES THEM TO THE APPLICATION IS NOT KNOWN and is recorded as a risk on
     e05s07 rather than assumed in either direction.

  A GAP IN e05s05 WAS FOUND AND CLOSED WHILE CAPTURING THE ABOVE. Its TerminalJsonObject - written to read
  the LAST object precisely because there are two - had only ever been tested with ONE object, so the
  behaviour it exists for was uncovered. There is now a test that feeds the captured two-object wire text
  through the adapter and asserts the specification is not mistaken for the result.

  e05s06 CHANGED ONE RULE FOR EVERY PERMISSION, AND ITS SECURITY PASS FOUND TWO REAL DEFECTS IN ITS OWN
  WORK. A permission now carries what it does when the deployment has no identity provider: the catalogue
  opens, because refusing would make a demonstration that boots without configuration unusable, and the AI
  feature CLOSES, because a deployment that has not been told which claim entitles a caller has not been
  finished. The parameter is REQUIRED, not defaulted, so the compiler asks every future permission the
  question. Two things were then found by looking adversarially rather than by claiming a review:

  1. UnconfiguredBehaviour was declared Open-first, so default(UnconfiguredBehaviour) - and any future
     zero-initialisation - meant ALLOW, in the very enum written to prevent that. Closed is now first, so
     even the accident falls the safe way.
  2. TryAddSingleton looked like the tidy way to let each permission register the shared handler. It is
     keyed on IAuthorizationHandler, which the identity packages also register implementations of, so the
     application's handler was SILENTLY NOT ADDED and every permission denied. The catalogue's own tests
     caught it by answering 403. Reverted to AddSingleton: a duplicate instance applies the same rule and
     is harmless, a missing one denies everyone.

  A GATE THAT COVERED ONLY ONE PERMISSION WAS WIDENED. AUTH-15 asserted no claim value is written into the
  application, but it greps for the catalogue's literal "read:catalog", so a permission added later was not
  covered. AuthorizationGateTests now also asserts the shape - nothing in the Host assigns a claim value -
  and that the money-spending permission is declared Closed where it is registered, so changing that answer
  has to break a test to happen.

  WHAT e05s06 DELIBERATELY DID NOT CLOSE: hiding a section is not authorisation. The endpoint that spends
  the money does not exist until e05s07, and e05s07 mentioned NO POLICY AT ALL - so a requirement to gate it
  with AiPolicy.Name was written there, in both its story and its first task. That is the connection between
  the two stories and the reason e05s06's protection is only half a protection until e05s07 is built.

  STREAMING: the model's own text is shown during the run, revealed as each JSON string value
  completes - never raw JSON, never token-by-token, which is also what lets hygiene run on a complete
  value before display. Streamed text is purpose only: no prices, no product names, currency stripped as
  a backstop. On failure AND on cancel the text is kept and marked not applied. Cancelling is a neutral
  stopped state, logged as cancelled. Stages are retained and collapsed. The READING and the HYGIENE
  live in the APPLICATION (e05s04, context: app), because that is where display happens - so the agent
  carries no customer-facing code, no Streaming/ and no Guardrails/ folder.

  UI: the section sits at the top of the centre column ABOVE THE CANVAS - it is the region the suggestion
  rewrites. Collapsed to one line when idle, expanded while running or showing candidates, one region and
  never a modal, full-width on a phone, on the BUILDER ONLY, and absent entirely when the feature is off
  or the permission is missing. A11Y: the streamed prose is NOT a live region (it is commentary); the
  stage lines go into a polite role=status region matching the application's alerts, and the candidates
  announce as the terminal outcome.

  CANDIDATES: the application sorts by monthly total and labels by rank - Budget / Balanced / Premium -
  because relative labels stay meaningful across a 30x price spread and for partial compositions. The
  specification carries the customer's stated monthly ceiling when given and never carries a band
  label. Fewer than three distinct options means fewer are shown; the panel tolerates one to three.

  APPLY: one atomic, versioned write that replaces the composition and leaves the delivery address
  untouched; a stale write is refused and applies nothing.

  ENTITLEMENT: signed-in with a configuration-declared permission, CLOSED when unconfigured, so a
  deployment that has not been told the claim shows no AI section. One run in flight per customer.

  IDENTITY/CALL: DefaultAzureCredential on both hops; no endpoint key and no model key anywhere. The
  application derives the per-agent endpoint (<project>/agents/<name>/endpoint/protocols/openai), builds
  a FoundryAgent with AIProjectClient.AsAIAgent(agentEndpoint), and streams with RunStreamingAsync, so
  configuration carries a project endpoint and a name and never a URL. SESSION: a run uses no session or
  a fresh one, NEVER a reused one - the hosted agent is a singleton shared across customers.

  RECORD: the query, a hash of the projection actually sent, model and prompt versions, tokens, model
  calls, latency, the model's RAW structured output, the verdict, an opaque customer id and the applied
  candidate; 90 days; no PII. The raw output is kept because a rejected run is otherwise unexplainable.
  Only the query and the catalogue cross to Foundry.

  PROMPTS: one file per agent, version in the filename, embedded into the assembly at build. NO skills
  are attached; a skill is added only if the evaluation demands one.

  PACKAGING/DEPLOY: direct CODE deploy - Foundry zips the project folder and builds it, so the root's
  Directory.Packages.props is not in that zip. The agent project is therefore SELF-CONTAINED: it
  declares exact package versions and overrides TWO properties, ImportDirectoryPackagesProps=false AND
  ManagePackageVersionsCentrally=false - the root turns central management on in Directory.Build.props as
  well as Directory.Packages.props, so disabling only the latter still makes every Version= an NU1008
  error (verified by building). It does NOT inherit the
  root's central pinning; container deploy (repo root as build context) would have preserved it, at the
  cost of Docker and a container registry.

  PACKAGES: Microsoft's own coherent set, from the .NET hosted sample - Microsoft.Agents.AI.Foundry and
  Microsoft.Agents.AI.Foundry.Hosting 1.20.0-preview.260831.1, Microsoft.Agents.AI.Workflows 1.20.0 (the
  same 2026-08-31 release), Azure.AI.Projects 3.0.0-beta.2, Azure.Identity 1.21.0. Hosting is
  preview-only, so there is no fully stable option. The APPLICATION needs only Foundry,
  Azure.AI.Projects and Azure.Identity, at the same pins, in its own Directory.Packages.props.

  HOSTING SHAPE (verified by scaffolding): the container is built with AgentHost.CreateBuilder(args) from
  Azure.AI.AgentServer.Core, AddFoundryResponses, and builder.RegisterProtocol("responses", endpoints =>
  endpoints.MapFoundryResponses()). The WebApplication.CreateBuilder + app.MapFoundryResponses shape does
  not apply to the pinned package.

  FRAMEWORK BEHAVIOUR FOUND BY e05s01's TESTS (both pinned by a test, not assumed): the typed result is
  deserialized LAZILY, so RunAsync<T> returns fine and the refusal surfaces when Result is read - reading
  it is part of the contract. And the deserializer is the ONLY enforcement on that path: prose and an
  unknown slot are refused; a quantity of zero and an unexpected price property are ACCEPTED SILENTLY.
  Hence e05s08's validation must carry quantity >= 1, and a stray property needs no handling because the
  application never reads a price from the agent.

  HOST BEHAVIOUR FOUND BY e05s01's HOST TEST: AgentHostApp exposes RunAsync(CancellationToken) - and the
  App and a blocking Run() - but NOT StartAsync/StopAsync. The host binds its own port, 8088 by default,
  honouring PORT and IGNORING ASPNETCORE_URLS, so a test takes a free port through PORT. And the hosted
  Responses path streams through the streaming chat-client member, so a fake that implements only
  GetResponseAsync fails every call with server_error.

  WORKFLOW RESPONSE SHAPE FOUND BY e05s03's TESTS: a sequential workflow's response carries BOTH agents'
  answers in order - the rephraser's specification first, the suggestor's result last - and RunAsync<T>
  deserializes the FIRST top-level object, so it returns the specification and fails the result contract.
  chainOnlyAgentResponses:true would make the response the terminal output alone but take the catalogue away
  from the suggestor, and AsAIAgent(..., includeWorkflowOutputsInResponse:false) still returns both (both
  verified by running them). ACCEPTED, because the catalogue reaching the suggestor matters more: the
  application's adapter reads the LAST top-level object, which e05s05 states for itself.

  CI: the existing .github/workflows/ci.yml builds and tests ONLY CoreRentalNet.sln, so a PATH-FILTERED
  job for AgentFoundry.sln is part of this epic (e05s09) - without it the agent's tests never run and the
  two-tree separation is nominal. The job needs no Azure credential; the live tiers stay out of it. The
  README's "nothing deploys" statement is corrected in the same story.

  ROLLOUT: config-gated, off unless explicitly enabled. The browser tier runs a local stand-in that
  speaks the same protocol, so the real adapter and the streaming path are exercised with no network. The
  stand-in lives in the APPLICATION's test tree as a test-only project pinned to shared/contracts - NOT
  in agentfoundry/, which stays a deployable rather than a test host.

  REGISTRY: specs/execution-status.yaml, specs/product/SCOPE_LATEST.yaml and specs/verifications/ were
  removed with this restructure and are deliberately NOT recreated. This capsule's test matrix carries the
  baseline section, so nothing here is blocked by their absence; the scope document is a product
  statement to be authored by the product owner, not reconstructed.

  EVAL OWNERSHIP: engineering DRAFTS the golden queries; the product owner APPROVES them before the gate
  is enforced, and the approval is recorded with the set. Without that approval the >= 80% bar grades the
  feature against its own author's assumptions.

  SPREAD: the dearest valid option must be at least 1.5x the cheapest, the factor held in
  configuration so the evaluation tier can tune it. The rule applies to the RANGE ONLY - the middle
  option is merely sorted between them and carries no second margin. Where the catalogue cannot produce
  options that far apart, fewer are shown rather than padded or failed.

  Security note for the reviewer: e05s06 edits the claim requirement that the security review covers,
