id: e04
slug: ai-builder
title: The AI section in the builder
status: in-progress
bcps: 25

deltas:
  - type: ADDED
    what: >-
      A permission-gated AI section on the builder page: a field for a request, a streamed run whose
      stages are named by the application, four rendered outcomes, and a confirm-then-replace apply
      path. The slots a candidate names replace the draft's slots; the delivery address is untouched.
  - type: MODIFIED
    what: >-
      How entitlement is decided. One parameterised claim requirement replaces the catalogue-specific
      one, so a second and third permission can be declared without copying the matching rule. The
      catalogue's own behaviour - open when no identity provider is configured - is unchanged.

