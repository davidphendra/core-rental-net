notes: |
  Decisions this epic implements, by register id: UI-1/P2 (additive gates, fail-closed when
  unconfigured), UI-2/E1 (the agent returns three, the Host renders the middle one for a
  non-poweruser, poweruser implies nothing), UI-3/M-1 (one parameterised claim requirement carrying
  its unconfigured behaviour), UI-4/S-1 (stage ids from the agent, wording owned by the application,
  polite announcements, cancellable, retained and collapsed), UI-5/D1 (only codes cross the boundary;
  no agent prose rendered), UI-6 (four outcome paths), UI-7/G-2 (one in-flight run per principal plus
  a cooldown, released on cancel), UI-8/C-1 (the application's own identity, no stored agent secret),
  UI-9 (endpoint, agent name and model deployment in configuration), APPLY-1/R1 (replace the slots,
  preserve the address, confirm only when non-empty), APPLY-2 (drop and report an unknown SKU),
  APPLY-3/A1 (one atomic command, one version bump, loud on conflict), TEST-1/T-1 (a real local agent
  process for the browser tier).

  Dependency: this epic compiles against the suggestion contract written by e02s02
  (agentfoundry/shared/contracts/). That is the only coupling between the two epics, and it can be
  satisfied by the schema alone - the browser tier talks to a local stand-in, so nothing here needs
  Foundry to exist.

  Security note for the reviewer: e04s01 edits authentication code that specs/security/REVIEW.md
  covers, in an epic that otherwise has nothing to do with authentication. It needs a review addendum,
  and the story says so.
