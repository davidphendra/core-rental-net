  - id: E3-T10
    title: Product images vendored, placeholder state for missing files
    type: ui
    status: done
    tests: [UI-05, UI-06]
    note: A test asserts that loading the real catalog against the real web root leaves no remote image path.
  - id: E3-T11
    title: Accessibility by markup, native dialog, real buttons
    type: ui
    status: partial
    tests: [UI-03, UI-04]
    note: >
      Markup discipline is applied throughout: real button and anchor elements, accessible names,
      aria-disabled on gated controls, a native dialog for the picker. The keyboard and focus
