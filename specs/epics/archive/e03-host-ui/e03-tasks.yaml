    note: >
      Includes rotation through a query flag that redirects without it, so a refresh does not
      rotate twice. E5 triggers it at checkout.

found_while_running:
  - "Nothing created the draft: the middleware issued a token and the first read threw. Added an idempotent StartDraft command; this was a missing decision, not a typo."
  - "Only five of the seven slots rendered: Lamp and Plant had geometry and no component."
  - "The database directory was never created, so a clean start-up failed with 'unable to open database file'."

follow_up_within_e3:
  - "The design system fonts were initially left to a fallback stack, because loading them from Google would have broken the hermetic test requirement. They are now self-hosted as latin-subset woff2 files under wwwroot/fonts, so the demo renders in Plus Jakarta Sans and Manrope with no third-party request. A test guards that the fonts are real files and that nothing in the host fetches from a third party."

deviations:
  - "The delivery fee lives in CheckoutSettings reading configuration. It belongs to the invoice model and moves there with the Rentals module."
  - "'Rent This Setup' is deliberately disabled: order creation is the checkout change, and a control that looks live but does nothing is worse than one that explains itself."
