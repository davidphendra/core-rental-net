tasks:
  - id: E3-T1
    title: Host project, composition root, InteractiveServer, module registration
    type: infra
    status: done
    note: >
      Modules are wired in Program.cs rather than through a per-module ModuleStartup. With three
      modules that is one readable file instead of three indirections.
  - id: E3-T2
    title: tokens.css from DESIGN.md, base.css, no hardcoded colour anywhere else
    type: ui
    status: done
    tests: [UI-01]
    note: >
      The desk's wood tones and the two alpha values were literals in my own CSS. They are now
      tokens too, flagged as not coming from DESIGN.md, because a colour literal is how a design
      system stops being one.
  - id: E3-T3
    title: slots.css geometry keyed by slot id, no coordinates in component code
    type: ui
    status: done
    tests: [UI-02]
    note: >
      A test now asserts every slot is rendered and every canvas slot has geometry. It exists
      because two slots had geometry and no component, so they were invisible and nothing failed.
  - id: E3-T4
    title: Marketing and Builder layouts, header, mobile bottom nav
    type: ui
    status: done
    tests: [NAV-03]
  - id: E3-T5
    title: Home page
    type: ui
    status: done
    note: Featured cards come from the popular badge, not from hardcoded product names.
  - id: E3-T6
    title: Builder with canvas, picker, steppers, remove control, running total
    type: ui
    status: done
    tests: [SLOT-04]
  - id: E3-T7
    title: Store page
    type: ui
    status: done
  - id: E3-T8
    title: Review page with quote, two-line address field, totals, zone tiles
    type: ui
    status: done
    tests: [ADDR-06]
