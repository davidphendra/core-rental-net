feature_name: workspace-suggestions
core_value: >-
  A customer describes the workspace they want in words, and the builder answers with three concrete,
  priced options taken from the real catalogue and ready to add to the draft.

summary: |
  The builder today asks a customer to compose a workspace slot by slot. This initiative lets them
  instead describe what they want - "a quiet corner for two monitors and a decent chair" - and be
  offered three options to accept.

  The reasoning runs in a Microsoft Foundry hosted agent, built with Microsoft Agent Framework and
  deployed as a container. The agent reaches the catalogue through a Foundry Toolbox whose OpenAPI
  tool describes the endpoint that already exists, GET /api/catalog, and authenticates with an Auth0
  machine-to-machine client holding read:catalog. That endpoint is unchanged: it is the contract,
  exercised by a real machine caller for the first time.

  The agent must answer with exactly three options as strict structured output. The application
  validates every SKU in that answer against the catalogue before showing it, so a language model
  can never put a product that does not exist in front of a customer. This is a development and test
  initiative: it provisions Foundry resources in a throwaway resource group and does not deploy the
  application to production.

in_scope:
  - id: e02s01
    item: >-
      A time-boxed spike proving that a Foundry oauth2 connection can obtain an Auth0
      client-credentials token and call GET /api/catalog through a Toolbox OpenAPI tool, with a
      written go/no-go. The fallback, if it fails, is the agent calling the endpoint from its own
      container with the exchange implemented in code.
  - id: e02s02
    item: >-
      The published OpenAPI document declares the clientCredentials flow beside the sign-in flow, and
      the catalogue operation carries the summary and description the imported tool schema needs.
  - id: e02s03
    item: >-
      The durable Foundry setup: project, model deployment, Auth0 machine-to-machine client, oauth2
      connection, and a Toolbox whose OpenAPI tool points at GET /api/catalog - proven by a recorded
      tool call that the endpoint logs.
  - id: e02s04
    item: >-
      A hosted agent - a Microsoft Agent Framework container - whose instructions rank catalogue
      products by name and description, and whose answer is exactly three options, enforced by a
      strict JSON schema.
  - id: e02s05
    item: >-
      The builder feature: the customer types a request, sees three options, and adds one to the
      draft. Every returned SKU is validated against the catalogue, and an unavailable agent is
      reported rather than papered over.

out_of_scope:
  - item: Broadening the catalogue search to description, SKU, or the category vocabulary.
    reason: not needed - the agent reads the whole 62-row snapshot and ranks name and description in-model, so the store's name-only search stays as it is.
  - item: Embeddings, vector search, or Azure AI Search.
    reason: not valuable - 62 immutable rows fit in a single request; an index would add a service, a cost and a reindex path for nothing.
  - item: Per-user identity for the agent (OAuth identity passthrough, delegated login).
    reason: not valuable - the catalogue is a public read; a shared machine identity holding read:catalog is the least privilege that works.
  - item: A hand-written MCP server, or publishing the Toolbox to a second consumer.
    reason: deferred - the Toolbox already exposes an MCP-compatible endpoint; a second host is what would justify publishing it.
  - item: Production deployment of the application or of the agent.
    reason: deferred - the repository has no deployment configuration and no production deployment decision has been made.
  - item: Write access to the catalogue, and any change to the Catalog module's Domain or Application.
    reason: out of scope - the catalogue is an immutable snapshot and the agent only reads it.
  - item: Payment, checkout, invoicing, or order-model changes.
    reason: out of scope - a suggestion only pre-fills the existing draft; the funnel is untouched.
  - item: Fine-tuning, or a retrieval pipeline over product data.
    reason: not valuable - instructions plus structured output are sufficient for 62 products.
  - item: Rate limiting, result caps, pagination, or a response-cache on the endpoint.
    reason: not valuable - the caller is one server-side agent and the collection is bounded.

constraints:
  platform: .NET 10; Microsoft Agent Framework for .NET; a Foundry hosted agent container
  auth: Auth0 machine-to-machine client credentials; the read:catalog permission and nothing else
  network: the catalogue endpoint must be reachable by Foundry, which needs a development tunnel or a development host
  provisioning: development/test only, in a throwaway resource group; the product owner has consented
  secrets: no secret in the repository; the Auth0 client credential is held by the Foundry connection
  baselines: BUILD, NONBROWSER and BROWSER stay green; Foundry-dependent checks are opt-in live tests
  reuse: the endpoint, its policy and its logging are reused unchanged; nothing new in the Catalog module

success_criteria:
  - criterion: A typed request yields exactly three options.
    evidence: 'a request naming two monitors and a chair returns three options, each naming SKUs that exist in the catalogue.'
  - criterion: The catalogue is reached over HTTP by the agent.
    evidence: the endpoint's structured log records the agent's call, its filters and its result count.
  - criterion: The agent cannot read the catalogue without the permission.
    evidence: the same tool call with a client that lacks read:catalog is refused 403 and the agent receives no products.
  - criterion: A model cannot invent a product.
    evidence: an option naming an unknown SKU is dropped before it reaches the page; fewer than three valid options is stated, not padded.
  - criterion: An unavailable agent is visible.
    evidence: with the agent unconfigured or unreachable the builder says so and offers no options.
  - criterion: Behaviour did not move.
    evidence: the three baselines are green and the builder still composes a draft manually.

