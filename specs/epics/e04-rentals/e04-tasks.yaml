epic: e04-rentals
slice: 1
status: complete
completed: 2026-09-10

tasks:
  - id: E4-T1
    title: Rental aggregate, RentalNumber, status transitions, address and line snapshots
    type: domain
    status: done
    tests: [CO-06, CO-14, SC-11]
    note: >
      Every transition is a named operation, so an illegal move is an error rather than a state
      nobody considered. The anchor date is stored once and period N is computed from it.
  - id: E4-T2
    title: Invoice aggregate, InvoiceNumber sequence, lines, subtotal, tax rule, total, Open to Paid
    type: domain
    status: done
    tests: [CO-07, CO-08, CO-09, CO-14]
    note: >
      The tax rate is stored per invoice, so enabling tax later cannot reinterpret a bill that was
      already issued. Tax applies to the rental and not to the one-time delivery charge.
  - id: E4-T3
    title: Policies - delivery lead time, renewal on anniversary, cancellation at end of paid period
    type: domain
    status: done
    tests: [SC-01, SC-06, SC-07, SC-08]
  - id: E4-T4
    title: IPaymentGateway and DemoPaymentGateway
    type: infra
    status: dropped
    tests: [CO-07]
    note: >
      Deliberately not built. ADR-0010 already records that there is no payment provider and that
      payment cannot fail in this application, so an interface whose only implementation returns
      true would be indirection with no second implementation and no behaviour to test. The first
      invoice is settled directly by the order service.
  - id: E4-T5
    title: Access token, lookup by token, invoices by token
    type: application
    status: done
    tests: [ORD-01, ORD-02, ORD-04, SEC-02, SEC-06]
    note: >
      The query takes a token and never an order number, so there is nothing to enumerate. An
      unknown token returns null rather than throwing.
  - id: E4-T6
    title: RentalsContext, configuration, migrations for the Rentals_ tables
    type: infra
    status: done
    tests: [ARC-02, ARC-03]
    note: >
      Number reservations are a single atomic insert-or-increment executed on the connection,
      because EF will not compose over a statement that is not a SELECT. Two checkouts racing each
      other therefore cannot take the same number, and a gap is preferred to a duplicate.

found_while_building:
  - "Both modules share one database file, so they would have shared EF's single migration history table. Each module now keeps its own, and a test asserts it."
  - "The integration test helper was building its own DbContext options, so it drifted from the host. It now goes through each module's persistence configuration."
  - "Record equality compares a collection member by reference, so two reads of the same order were never equal. The test now compares structurally."

deviations:
  - "The draft token and the order access token were the same mechanism written twice. Both now wrap one OpaqueToken in BuildingBlocks, kept as distinct types so they cannot be confused."
  - "Money is stored as a single decimal column rather than an owned type with a currency column, because this application bills in rupiah only. Writing anything other than IDR fails loudly rather than losing the currency. A second currency would make that conversion a pair of columns."
