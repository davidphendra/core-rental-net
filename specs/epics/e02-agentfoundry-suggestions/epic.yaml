id: e02
slug: agentfoundry-suggestions
title: The Foundry agent that composes three workspace candidates
status: planned
bcps: 36

deltas:
  - type: ADDED
    what: >-
      A Foundry hosted agent - one container running a four-agent Microsoft Agent Framework workflow -
      that reads the catalogue, composes three candidates across low, middle and high budget, reviews
      them, and answers with a typed result streamed as stage events. Nothing in the application
      changes; the agent is a new deployable unit beside it.

