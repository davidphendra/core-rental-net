# Azure DevOps pipeline for CoreRentalNet.
#
# Two stages, deliberately separated:
#   CI     - restore, build (warnings are errors), run the non-browser suite, publish the host.
#            Runs on every pull request and every push to `main`.
#   Deploy - publishes the CI artifact to Azure App Service, gated by a manual approval on the
#            ADO Environment below. Skipped entirely for pull requests, so an approval is only
#            ever asked for on `main`.
#
# Configuration (secrets, connection strings, Auth0 values, database paths) is NOT applied here.
# It lives in App Service configuration, set out of band. The pipeline ships code only, so no
# secret ever enters this repository (CLAUDE.md: "No secrets in the repository").
#
# The database is disposable: this is a demonstration application and the content root is allowed
# to be ephemeral. The application recreates App_Data on cold start; nothing needs to persist.

name: $(Date:yyyyMMdd)$(Rev:.r)

# ---------------------------------------------------------------------------------------------
# The deployment target is not stored in this file. The service connection, app name, resource
# group and app type come from the `core-rental-app-service` variable group (Pipelines ->
# Library), so a server change is a Library edit rather than a commit. Create the group and
# authorize this pipeline on it before the first deploy.
# ---------------------------------------------------------------------------------------------
variables:
  # Build. A `variables:` block is either a mapping or a sequence, never both, so adding the
  # group reference below puts these in the sequence form.
  - name: buildConfiguration
    value: 'Release'
  - name: dotnetVersion
    value: '10.0.400'
  - name: solution
    value: 'CoreRentalNet.sln'
  - name: hostProject
    value: 'src/Host/CoreRentalNet.Host/CoreRentalNet.Host.csproj'
  # Directory.Build.props expects a release pipeline to pass the version, and scripts/resolve-version.sh
  # resolves it from the tag being built. versionFloor is the version an untagged build keeps.
  - name: versionFloor
    value: '0.1.0'
  # The environment the deployed artifact is stamped as. Baked into the assembly rather than injected at
  # run time, so the running application reports where it was built to run from its own metadata. The agent
  # pipeline's `agentEnvironment` is the same value by the same rule.
  - name: appEnvironment
    value: 'production'

  # Deployment target — never a value in this file. The group holds AZURE_SERVICE_CONNECTION,
  # WEB_APP_NAME, RESOURCE_GROUP and APP_SERVICE_TYPE (`webApp` for Windows, `webAppLinux` for
  # Linux; the deploy task accepts no container value).
  - group: 'core-rental-app-service'

# The agent tree is a separate deployable with its own pipeline (agentfoundry/azure-pipelines.yml),
# so an agent-only change does not rebuild or redeploy this application.
trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - agentfoundry/**

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - agentfoundry/**

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: CI
  displayName: 'Build & Test'
  jobs:
  - job: BuildTest
    displayName: 'Restore, build, test, publish'
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET SDK $(dotnetVersion)'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'
        # .NET 10 is new; the preview flag lets the task find the pinned SDK if it is not yet on
        # the default feed. Remove it once 10.0.400 is generally available.
        includePreviewVersions: true

    # The release identity is the tag. The build never reads Git: this resolves the tag the pipeline
    # is building and passes the result to every later step, so the artifact and the runtime agree.
    - script: bash scripts/resolve-version.sh
      displayName: 'Resolve version from the tag'

    - script: dotnet restore $(solution)
      displayName: 'Restore'

    # Warnings are errors (Directory.Build.props), so a style or analyser regression fails the
    # build here rather than being noticed later.
    - script: >-
        dotnet build $(solution)
        --configuration $(buildConfiguration)
        --no-restore
        -p:Version=$(version)
        -p:InformationalVersion=$(informationalVersion)
        -p:GitSha=$(shortSha)
        -p:BuildId=$(Build.BuildId)
        -p:AppEnvironment=$(appEnvironment)
      displayName: 'Build (Release)'

    # The gate: unit, architecture and integration tests. The browser suite (CoreRentalNet.E2E)
    # is excluded on purpose — it needs Chromium and stays a local check.
    - script: >-
        dotnet test $(solution)
        --configuration $(buildConfiguration)
        --no-build
        --filter "FullyQualifiedName!~CoreRentalNet.E2E"
        --logger "trx;LogFileName=test-results.trx"
        --results-directory $(Agent.TempDirectory)
      displayName: 'Unit, architecture and integration tests'

    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/*.trx'
        searchFolder: '$(Agent.TempDirectory)'

    - script: >-
        dotnet publish $(hostProject)
        --configuration $(buildConfiguration)
        --no-restore
        -p:Version=$(version)
        -p:InformationalVersion=$(informationalVersion)
        -p:GitSha=$(shortSha)
        -p:BuildId=$(Build.BuildId)
        -p:AppEnvironment=$(appEnvironment)
        --output $(Build.ArtifactStagingDirectory)/app
      displayName: 'Publish host'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/app'
        # Named with the release and the commit, so two artifacts of one release are told apart by
        # the name. The build ID remains the immutable identity: a given version is never rebuilt.
        artifact: 'app-$(version)-$(shortSha)'

# ---------------------------------------------------------------------------------------------
# Deployment. The Environment below carries a manual approval check, configured once in the ADO
# UI (Pipelines -> Environments -> core-rental-production -> Approvals and checks). The stage is
# created on a `main` push, pauses, and proceeds only when an approver releases it. Pull requests
# skip the stage entirely.
# ---------------------------------------------------------------------------------------------
- stage: Deploy
  displayName: 'Deploy to Azure App Service'
  dependsOn: CI
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - deployment: DeployWeb
    displayName: 'Deploy'
    environment: 'core-rental-production'
    strategy:
      runOnce:
        deploy:
          steps:
          # The version is a pure function of the tag and the commit, so resolving it again here names
          # the artifact this run published. No cross-stage variable plumbing is needed.
          - checkout: self

          - script: bash scripts/resolve-version.sh
            displayName: 'Resolve version from the tag'

          - download: current
            artifact: 'app-$(version)-$(shortSha)'

          # The deployment target comes from the `core-rental-app-service` variable group. An
          # undefined macro is left as the literal `$(NAME)` rather than blanked, so this rejects
          # both a missing value and an unresolved one, and names which, before anything deploys.
          - script: |
              set -euo pipefail
              for name in AZURE_SERVICE_CONNECTION WEB_APP_NAME RESOURCE_GROUP APP_SERVICE_TYPE; do
                value="${!name:-}"
                case "$value" in
                  ''|*'$('*)
                    echo "##vso[task.logissue type=error]Variable group 'core-rental-app-service' is missing $name"
                    exit 1 ;;
                esac
              done
            displayName: 'Check the deployment target variables'
            env:
              AZURE_SERVICE_CONNECTION: '$(AZURE_SERVICE_CONNECTION)'
              WEB_APP_NAME: '$(WEB_APP_NAME)'
              RESOURCE_GROUP: '$(RESOURCE_GROUP)'
              APP_SERVICE_TYPE: '$(APP_SERVICE_TYPE)'

          # Code only. App settings and secrets are expected to be present in App Service. This task
          # accepts only Web App on Windows (`webApp`) and Web App on Linux (`webAppLinux`), so
          # `APP_SERVICE_TYPE` cannot name a container. The comment above the deployment target group
          # lists the accepted values.
          #
          # `runtimeStack`, `startUpCommand`, `appSettings` and `configurationStrings` are left unset
          # on purpose: this task would otherwise overwrite the runtime and settings the deployment
          # keeps out of band. `deploymentMethod` is left at its `auto` default, which zips the folder.
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              appType: '$(APP_SERVICE_TYPE)'
              appName: '$(WEB_APP_NAME)'
              resourceGroupName: '$(RESOURCE_GROUP)'
              package: '$(Pipeline.Workspace)/app-$(version)-$(shortSha)'
